name: Datos desde Webflow
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  bajar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WEBFLOW_SITE_TOKEN: ${{ secrets.WEBFLOW_SITE_TOKEN }}
      WEBFLOW_SITE_ID: 6ac29c3b8c31cd570fd18ee3
    steps:
      - id: token
        run: echo "hay=${{ secrets.WEBFLOW_SITE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.hay != 'true'
        run: echo "::notice::Falta el secret WEBFLOW_SITE_TOKEN; no se baja nada."
      - if: steps.token.outputs.hay == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.hay == 'true'
        uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: 'npm' }
      - if: steps.token.outputs.hay == 'true'
        run: npm ci
      - if: steps.token.outputs.hay == 'true'
        run: npm run vw -- bajar
      - if: steps.token.outputs.hay == 'true'
        run: npm run verify
      - if: steps.token.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/canonico src/assets && [ -z "$(git ls-files --others --exclude-standard src/assets)" ]; then
            echo "Sin cambios en Webflow."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/canonico src/assets
          git commit -m "Datos: lo publicado en Webflow"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          gh workflow run deploy.yml --ref main
