 42 / 0.1);transform:translateY(-2px)}.w-commerce-commercecheckouterrorstate{background:rgb(181 84 74 / .08);border:1.5px solid #b5544a;border-radius:14px;color:#b5544a;padding:12px 14px;margin-top:14px}.w-checkout-error-msg{color:#b5544a;font-weight:600;font-size:14px}.w-commerce-commercecheckoutbillingaddresstogglewrapper{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.w-commerce-commercecheckoutbillingaddresstogglelabel{margin:0;font-weight:600;font-size:14px}[data-vw-cliente]{background:#ffffff;border-radius:22px;padding:18px 26px;font-size:15px}[data-vw-cliente] a{color:#c28263;font-weight:800}@media (max-width:767px){.vw-cabecera{padding:16px 22px}.w-commerce-commercecheckoutformcontainer{padding:24px 16px 40px}.w-commerce-commercecheckoutblockcontent{padding:20px 18px}}</style>
<script>
(() => {
const SITIO = "veronicawellness.com";
const TEXTOS = {"email":"Email","cambiar":"Cambiar"};
const ES = {"Pay with browser.":"Paga con el navegador.","Customer Info":"Tus datos","* Required":"* Obligatorio","Shipping Address":"Dirección de envío","Full Name *":"Nombre completo *","Street Address *":"Dirección *","City *":"Ciudad *","State/Province":"Estado / Provincia","Zip/Postal Code *":"Código postal *","Country *":"País *","Shipping Method":"Envío","No shipping methods are available for the address given.":"No hay envío disponible para esta dirección.","Payment Info":"Pago","Card Number *":"Número de tarjeta *","Expiration Date *":"Vencimiento *","Security Code *":"Código de seguridad *","Billing address same as shipping":"La dirección de facturación es la misma de envío","Billing Address":"Dirección de facturación","Items in Order":"Tu pedido","Quantity:":"Cantidad:","Order Summary":"Resumen del pedido","Discount Code":"Código de descuento","Apply":"Aplicar","Apply Discount":"Aplicar descuento","Place Order":"Confirmar y pagar","Placing Order...":"Procesando…","Billing address optional":"Dirección de facturación opcional","Shipping address optional":"Dirección de envío opcional","Flat-Rate":"Tarifa fija","Free Shipping":"Envío gratis","Sales Tax":"Impuesto","Tax":"Impuesto","Shipping":"Envío","There was an error processing your customer info. Please try again, or contact us if you continue to have problems.":"Hubo un error con tus datos. Inténtalo de nuevo o escríbenos si el problema sigue."};
const ES_PATRONES = [["^Discount \\((.+)\\)$","Descuento ($1)"]];
const ERRORES = {"data-w-info-error":"Hubo un error con tus datos. Inténtalo de nuevo o escríbenos si el problema sigue.","data-w-shipping-error":"No podemos enviar tu pedido a esa dirección.","data-w-billing-error":"No se pudo completar el pago con esos datos. Revisa la tarjeta y la dirección de facturación, o usa otra tarjeta. Escríbenos si el problema sigue.","data-w-payment-error":"Hubo un error al procesar tu pago. Inténtalo de nuevo o escríbenos si el problema sigue.","data-w-pricing-error":"El precio de algo de tu pedido cambió. Recarga la página e inténtalo de nuevo.","data-w-minimum-error":"Tu pedido no llega al mínimo.","data-w-extras-error":"Cambió una configuración de la tienda. Recarga la página e inténtalo de nuevo.","data-w-product-error":"Algo de tu pedido ya no está disponible. Recarga la página e inténtalo de nuevo.","data-w-invalid-discount-error":"Este código no es válido.","data-w-expired-discount-error":"Este código ya no está disponible.","data-w-usage-reached-discount-error":"Este código ya no está disponible.","data-w-requirements-not-met-error":"Tu pedido no cumple las condiciones de este código."};
const MARCO = {"marca":"Veronica Wellness","volver":"https://veronicawellness.com/","volverTexto":"← Volver","pie":"Pago seguro · Tus datos están protegidos. Veronica Wellness no almacena datos de tarjeta."};
// The Webflow checkout in Spanish and with the site's frame (Mari, 2026-10-13). Webflow writes
// its checkout in English and the template's texts are not reachable from the API, so they are
// replaced here, on the page, and again whenever Webflow redraws a part of it.

                                         
                                              
                                              
                                                                                         

const patrones = ES_PATRONES.map(([de, a]) => [new RegExp(de), a]         );

function traducirTexto(texto        )                {
  const limpio = texto.replace(/\s+/g, ' ').trim();
  if (ES[limpio]) return texto.replace(limpio, ES[limpio]);
  for (const [de, a] of patrones) if (de.test(limpio)) return limpio.replace(de, a);
  return null;
}

function traducirNodos(raiz      ) {
  const recorrido = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  for (let n = recorrido.nextNode(); n; n = recorrido.nextNode()) {
    const nuevo = traducirTexto(n.nodeValue ?? '');
    if (nuevo !== null && nuevo !== n.nodeValue) n.nodeValue = nuevo;
  }
}

function traducirAtributos() {
  for (const el of document.querySelectorAll             ('[data-loading-text]')) {
    const nuevo = traducirTexto(el.getAttribute('data-loading-text') ?? '');
    if (nuevo) el.setAttribute('data-loading-text', nuevo);
  }
  for (const el of document.querySelectorAll             ('.w-checkout-error-msg'))
    for (const [atributo, texto] of Object.entries(ERRORES)) el.setAttribute(atributo, texto);
  for (const el of document.querySelectorAll             ('[aria-label]')) {
    const nuevo = traducirTexto(el.getAttribute('aria-label') ?? '');
    if (nuevo) el.setAttribute('aria-label', nuevo);
  }
}

// Country names come from the browser, in Spanish, keyed by the option's ISO code.
function traducirPaises() {
  if (typeof Intl === 'undefined' || !('DisplayNames' in Intl)) return;
  const nombres = new Intl.DisplayNames(['es'], { type: 'region' });
  for (const select of document.querySelectorAll                   (
    '.w-commerce-commercecheckoutshippingcountryselector, .w-commerce-commercecheckoutbillingcountryselector'
  )) {
    const opciones = [...select.options];
    for (const o of opciones) {
      try {
        const nombre = nombres.of(o.value);
        if (nombre && nombre !== o.value) o.textContent = nombre;
      } catch {
        /* a code the browser does not know keeps Webflow's name */
      }
    }
    const elegida = select.value;
    opciones.sort((a, b) => (a.textContent ?? '').localeCompare(b.textContent ?? '', 'es'));
    select.append(...opciones);
    select.value = elegida;
  }
}

function marco() {
  if (document.querySelector('[data-vw-marco]')) return;
  const cabecera = document.createElement('header');
  cabecera.setAttribute('data-vw-marco', '');
  cabecera.className = 'vw-cabecera';
  const marca = document.createElement('a');
  marca.className = 'vw-marca';
  marca.href = MARCO.volver;
  marca.innerHTML =
    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="4" r="2" fill="currentColor"/><path d="M4 10L12 15L20 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16L12 21L20 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const nombre = document.createElement('span');
  nombre.textContent = MARCO.marca;
  marca.append(nombre);
  const volver = document.createElement('a');
  volver.className = 'vw-volver';
  volver.href = MARCO.volver;
  volver.textContent = MARCO.volverTexto;
  cabecera.append(marca, volver);
  document.body.prepend(cabecera);
  const pie = document.createElement('footer');
  pie.className = 'vw-pie';
  pie.textContent = MARCO.pie;
  document.body.append(pie);
}

function espanol() {
  document.documentElement.lang = 'es';
  marco();
  traducirNodos(document.body);
  traducirAtributos();
  traducirPaises();
  document.documentElement.classList.add('vw-lista');
  new MutationObserver((cambios) => {
    for (const c of cambios) {
      if (c.type === 'characterData') {
        const nuevo = traducirTexto(c.target.nodeValue ?? '');
        if (nuevo !== null && nuevo !== c.target.nodeValue) c.target.nodeValue = nuevo;
      } else c.addedNodes.forEach((n) => traducirNodos(n));
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
}

espanol();
/**
 * What the site's checkout hands to Webflow's (Mari, 2026-10-13): the discount code typed in the
 * order summary, and the email, name and country already asked in step 1, so the Webflow
 * checkout does not ask them again. The site cannot check a code — discounts live in Webflow and
 * its API does not expose them — so it only carries it. The carrier is a cookie shared by
 * veronicawellness.com and pago.veronicawellness.com, read once and deleted by webflow/caja.ts.
 */

const COOKIE_TRASPASO = 'vw_caja';

/** Half an hour: enough to fill the checkout, short enough not to surprise a later visit. */
const VIDA_SEGUNDOS = 1800;

                           
                 
                 
                  
                                                               
                
 

/** The site's country names (Checkout.astro) to Webflow's codes; «Otro» has none. */
const CODIGO_PAIS                         = {
  'Estados Unidos': 'US',
  México: 'MX',
  España: 'ES',
  Colombia: 'CO',
  Argentina: 'AR',
  Chile: 'CL',
  Perú: 'PE',
  Ecuador: 'EC',
  Venezuela: 'VE',
  'República Dominicana': 'DO',
};

function limpiarCupon(texto        )         {
  return texto.replace(/\s+/g, '').slice(0, 64);
}

/** The parent domain both hosts share (veronicawellness.com), or null if they share none. */
function dominioCompartido(a        , b        )                {
  const x = a.toLowerCase().split('.').reverse();
  const y = b.toLowerCase().split('.').reverse();
  const comun           = [];
  for (let i = 0; i < Math.min(x.length, y.length) && x[i] === y[i]; i++) comun.push(x[i]);
  return comun.length >= 2 ? comun.reverse().join('.') : null;
}

function depurar(datos          )           {
  const salida           = {};
  const cupon = limpiarCupon(datos.cupon ?? '');
  if (cupon) salida.cupon = cupon;
  const email = (datos.email ?? '').trim().slice(0, 254);
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) salida.email = email;
  const nombre = (datos.nombre ?? '').replace(/\s+/g, ' ').trim().slice(0, 120);
  if (nombre) salida.nombre = nombre;
  if (/^[A-Z]{2}$/.test(datos.pais ?? '')) salida.pais = datos.pais;
  return salida;
}

/** The cookie to write; with nothing worth carrying, the one that deletes it. */
function cookieTraspaso(datos                 , dominio               )         {
  const limpio = datos ? depurar(datos) : {};
  const vacio = Object.keys(limpio).length === 0;
  return [
    `${COOKIE_TRASPASO}=${vacio ? '' : encodeURIComponent(JSON.stringify(limpio))}`,
    'path=/',
    `max-age=${vacio ? 0 : VIDA_SEGUNDOS}`,
    'SameSite=Lax',
    ...(dominio ? [`domain=${dominio}`] : []),
  ].join('; ');
}

function leerTraspaso(cookies        )                  {
  const valor = cookies
    .split(';')
    .map((c) => c.trim())
    .find((c) => c.startsWith(`${COOKIE_TRASPASO}=`))
    ?.slice(COOKIE_TRASPASO.length + 1);
  if (!valor) return null;
  try {
    const datos = depurar(JSON.parse(decodeURIComponent(valor))            );
    return Object.keys(datos).length ? datos : null;
  } catch {
    return null;
  }
}
const espera = (ms        ) => new Promise((r) => setTimeout(r, ms));

async function hasta   (leer                            , ms = 15000)                    {
  const fin = Date.now() + ms;
  for (;;) {
    const valor = leer();
    if (valor) return valor;
    if (Date.now() > fin) return null;
    await espera(150);
  }
}

const campo = (id        ) =>
  document.getElementById(id)                                               ;

// A `change` is what makes Webflow save the field in the order (its own handlers listen for it).
function poner(id        , valor                    ) {
  const el = campo(id);
  if (!el || !valor || el.value === valor) return;
  if (el instanceof HTMLSelectElement && ![...el.options].some((o) => o.value === valor)) return;
  el.value = valor;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

// Only fills what is still empty: whatever the person typed in this checkout wins.
function rellenar(datos          ) {
  const vacio = (id        ) => !campo(id)?.value;
  if (vacio('wf-ecom-email')) poner('wf-ecom-email', datos.email);
  if (vacio('wf-ecom-billing-name')) poner('wf-ecom-billing-name', datos.nombre);
  if (vacio('wf-ecom-shipping-name')) poner('wf-ecom-shipping-name', datos.nombre);
  poner('wf-ecom-billing-country', datos.pais);
}

// The email is already known: one line with it and «Cambiar» instead of the whole block.
function resumirCliente(email        ) {
  const bloque = document.querySelector             (
    '.w-commerce-commercecheckoutcustomerinfowrapper'
  );
  if (!bloque || document.querySelector('[data-vw-cliente]')) return;
  const linea = document.createElement('p');
  linea.setAttribute('data-vw-cliente', '');
  linea.style.cssText = 'margin:0 0 16px;display:flex;gap:12px;align-items:baseline';
  const texto = document.createElement('span');
  texto.textContent = `${TEXTOS.email}: ${email}`;
  const cambiar = document.createElement('a');
  cambiar.href = '#';
  cambiar.textContent = TEXTOS.cambiar;
  cambiar.addEventListener('click', (e) => {
    e.preventDefault();
    bloque.style.removeProperty('display');
    linea.remove();
    campo('wf-ecom-email')?.focus();
  });
  linea.append(texto, cambiar);
  bloque.style.display = 'none';
  bloque.before(linea);
}

const entradaCupon = () =>
  document.querySelector                  ('.w-commerce-commercecheckoutdiscountsinput');

function enviarCupon(codigo        ) {
  const entrada = entradaCupon();
  const formulario = entrada?.form;
  if (!entrada || !formulario) return;
  entrada.value = codigo;
  if (formulario.requestSubmit) formulario.requestSubmit();
  else formulario.querySelector             ('button')?.click();
}

// Webflow empties the field when the code is accepted and shows its own error when not; a field
// that still holds the code with no error means the submit was lost, so it is sent once more.
async function aplicarCupon(codigo        ) {
  enviarCupon(codigo);
  const resuelto = await hasta(() => {
    const error = document.querySelector             ('.w-commerce-commercecheckouterrorstate');
    return entradaCupon()?.value === '' || (!!error && error.style.display !== 'none');
  }, 5000);
  if (!resuelto) enviarCupon(codigo);
}

async function principal() {
  const datos = leerTraspaso(document.cookie);
  if (!datos) return;
  document.cookie = cookieTraspaso(null, dominioCompartido(location.hostname, SITIO));
  // Webflow fills the summary once the cart has loaded and its handlers are in place; anything
  // written before that is lost.
  await hasta(
    () =>
      (window                                    ).Webflow &&
      document.querySelector('.w-commerce-commercecheckoutsummarytotal')?.textContent?.trim()
  );
  await espera(400);
  rellenar(datos);
  if (datos.email && campo('wf-ecom-email')?.value === datos.email) resumirCliente(datos.email);
  if (datos.cupon) await aplicarCupon(datos.cupon);
  // Applying the code redraws the checkout; put back anything the redraw emptied.
  await espera(1500);
  rellenar(datos);
}

principal();
})();
</script>
