<script>
(() => {
const SITIO = "veronicawellness.com";
const TEXTOS = {"email":"Email","cambiar":"Cambiar"};
/**
 * What the site's checkout hands to Webflow's (Mari, 2026-10-13): the discount code typed in the
 * order summary, and the email, name and country already asked in step 1, so the Webflow
 * checkout does not ask them again. The site cannot check a code — discounts live in Webflow and
 * its API does not expose them — so it only carries it. The carrier is a cookie shared by
 * veronicawellness.com and pago.veronicawellness.com, read once and deleted by webflow/caja.ts.
 */

const COOKIE_TRASPASO = 'vw_caja';

/** Half an hour: enough to fill the checkout, short enough not to surprise a later visit. */
const VIDA_SEGUNDOS = 1800;

                           
                 
                 
                  
                                                               
                
 

/** The site's country names (Checkout.astro) to Webflow's codes; «Otro» has none. */
const CODIGO_PAIS                         = {
  'Estados Unidos': 'US',
  México: 'MX',
  España: 'ES',
  Colombia: 'CO',
  Argentina: 'AR',
  Chile: 'CL',
  Perú: 'PE',
  Ecuador: 'EC',
  Venezuela: 'VE',
  'República Dominicana': 'DO',
};

function limpiarCupon(texto        )         {
  return texto.replace(/\s+/g, '').slice(0, 64);
}

/** The parent domain both hosts share (veronicawellness.com), or null if they share none. */
function dominioCompartido(a        , b        )                {
  const x = a.toLowerCase().split('.').reverse();
  const y = b.toLowerCase().split('.').reverse();
  const comun           = [];
  for (let i = 0; i < Math.min(x.length, y.length) && x[i] === y[i]; i++) comun.push(x[i]);
  return comun.length >= 2 ? comun.reverse().join('.') : null;
}

function depurar(datos          )           {
  const salida           = {};
  const cupon = limpiarCupon(datos.cupon ?? '');
  if (cupon) salida.cupon = cupon;
  const email = (datos.email ?? '').trim().slice(0, 254);
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) salida.email = email;
  const nombre = (datos.nombre ?? '').replace(/\s+/g, ' ').trim().slice(0, 120);
  if (nombre) salida.nombre = nombre;
  if (/^[A-Z]{2}$/.test(datos.pais ?? '')) salida.pais = datos.pais;
  return salida;
}

/** The cookie to write; with nothing worth carrying, the one that deletes it. */
function cookieTraspaso(datos                 , dominio               )         {
  const limpio = datos ? depurar(datos) : {};
  const vacio = Object.keys(limpio).length === 0;
  return [
    `${COOKIE_TRASPASO}=${vacio ? '' : encodeURIComponent(JSON.stringify(limpio))}`,
    'path=/',
    `max-age=${vacio ? 0 : VIDA_SEGUNDOS}`,
    'SameSite=Lax',
    ...(dominio ? [`domain=${dominio}`] : []),
  ].join('; ');
}

function leerTraspaso(cookies        )                  {
  const valor = cookies
    .split(';')
    .map((c) => c.trim())
    .find((c) => c.startsWith(`${COOKIE_TRASPASO}=`))
    ?.slice(COOKIE_TRASPASO.length + 1);
  if (!valor) return null;
  try {
    const datos = depurar(JSON.parse(decodeURIComponent(valor))            );
    return Object.keys(datos).length ? datos : null;
  } catch {
    return null;
  }
}
const espera = (ms        ) => new Promise((r) => setTimeout(r, ms));

async function hasta   (leer                            , ms = 15000)                    {
  const fin = Date.now() + ms;
  for (;;) {
    const valor = leer();
    if (valor) return valor;
    if (Date.now() > fin) return null;
    await espera(150);
  }
}

const campo = (id        ) =>
  document.getElementById(id)                                               ;

// A `change` is what makes Webflow save the field in the order (its own handlers listen for it).
function poner(id        , valor                    ) {
  const el = campo(id);
  if (!el || !valor || el.value === valor) return;
  if (el instanceof HTMLSelectElement && ![...el.options].some((o) => o.value === valor)) return;
  el.value = valor;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

// Only fills what is still empty: whatever the person typed in this checkout wins.
function rellenar(datos          ) {
  const vacio = (id        ) => !campo(id)?.value;
  if (vacio('wf-ecom-email')) poner('wf-ecom-email', datos.email);
  if (vacio('wf-ecom-billing-name')) poner('wf-ecom-billing-name', datos.nombre);
  if (vacio('wf-ecom-shipping-name')) poner('wf-ecom-shipping-name', datos.nombre);
  poner('wf-ecom-billing-country', datos.pais);
}

// The email is already known: one line with it and «Cambiar» instead of the whole block.
function resumirCliente(email        ) {
  const bloque = document.querySelector             (
    '.w-commerce-commercecheckoutcustomerinfowrapper'
  );
  if (!bloque || document.querySelector('[data-vw-cliente]')) return;
  const linea = document.createElement('p');
  linea.setAttribute('data-vw-cliente', '');
  linea.style.cssText = 'margin:0 0 16px;display:flex;gap:12px;align-items:baseline';
  const texto = document.createElement('span');
  texto.textContent = `${TEXTOS.email}: ${email}`;
  const cambiar = document.createElement('a');
  cambiar.href = '#';
  cambiar.textContent = TEXTOS.cambiar;
  cambiar.addEventListener('click', (e) => {
    e.preventDefault();
    bloque.style.removeProperty('display');
    linea.remove();
    campo('wf-ecom-email')?.focus();
  });
  linea.append(texto, cambiar);
  bloque.style.display = 'none';
  bloque.before(linea);
}

const entradaCupon = () =>
  document.querySelector                  ('.w-commerce-commercecheckoutdiscountsinput');

function enviarCupon(codigo        ) {
  const entrada = entradaCupon();
  const formulario = entrada?.form;
  if (!entrada || !formulario) return;
  entrada.value = codigo;
  if (formulario.requestSubmit) formulario.requestSubmit();
  else formulario.querySelector             ('button')?.click();
}

// Webflow empties the field when the code is accepted and shows its own error when not; a field
// that still holds the code with no error means the submit was lost, so it is sent once more.
async function aplicarCupon(codigo        ) {
  enviarCupon(codigo);
  const resuelto = await hasta(() => {
    const error = document.querySelector             ('.w-commerce-commercecheckouterrorstate');
    return entradaCupon()?.value === '' || (!!error && error.style.display !== 'none');
  }, 5000);
  if (!resuelto) enviarCupon(codigo);
}

async function principal() {
  const datos = leerTraspaso(document.cookie);
  if (!datos) return;
  document.cookie = cookieTraspaso(null, dominioCompartido(location.hostname, SITIO));
  // Webflow fills the summary once the cart has loaded and its handlers are in place; anything
  // written before that is lost.
  await hasta(
    () =>
      (window                                    ).Webflow &&
      document.querySelector('.w-commerce-commercecheckoutsummarytotal')?.textContent?.trim()
  );
  await espera(400);
  rellenar(datos);
  if (datos.email && campo('wf-ecom-email')?.value === datos.email) resumirCliente(datos.email);
  if (datos.cupon) await aplicarCupon(datos.cupon);
  // Applying the code redraws the checkout; put back anything the redraw emptied.
  await espera(1500);
  rellenar(datos);
}

principal();
})();
</script>
