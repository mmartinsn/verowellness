<script>
(() => {
const SITIO = "veronicawellness.com";
/**
 * Discount code: typed in the site's order summary, applied by Webflow's own checkout (Mari,
 * 2026-10-13). The site cannot check a code — discounts live in Webflow and its API does not
 * expose them — so it only carries it: a cookie shared by veronicawellness.com and
 * pago.veronicawellness.com, read once by webflow/cupon.ts on the checkout page.
 */

const COOKIE_CUPON = 'vw_cupon';

/** Half an hour: enough to fill the checkout, short enough not to surprise a later visit. */
const VIDA_SEGUNDOS = 1800;

function limpiarCupon(texto        )         {
  return texto.replace(/\s+/g, '').slice(0, 64);
}

/** The parent domain both hosts share (veronicawellness.com), or null if they share none. */
function dominioCompartido(a        , b        )                {
  const x = a.toLowerCase().split('.').reverse();
  const y = b.toLowerCase().split('.').reverse();
  const comun           = [];
  for (let i = 0; i < Math.min(x.length, y.length) && x[i] === y[i]; i++) comun.push(x[i]);
  return comun.length >= 2 ? comun.reverse().join('.') : null;
}

function cookieCupon(codigo        , dominio               , borrar = false)         {
  return [
    `${COOKIE_CUPON}=${borrar ? '' : encodeURIComponent(codigo)}`,
    'path=/',
    `max-age=${borrar ? 0 : VIDA_SEGUNDOS}`,
    'SameSite=Lax',
    ...(dominio ? [`domain=${dominio}`] : []),
  ].join('; ');
}

function leerCupon(cookies        )         {
  const valor = cookies
    .split(';')
    .map((c) => c.trim())
    .find((c) => c.startsWith(`${COOKIE_CUPON}=`))
    ?.slice(COOKIE_CUPON.length + 1);
  if (!valor) return '';
  try {
    return limpiarCupon(decodeURIComponent(valor));
  } catch {
    return '';
  }
}
const espera = (ms        ) => new Promise((r) => setTimeout(r, ms));

async function hasta   (leer                            , ms = 15000)                    {
  const fin = Date.now() + ms;
  for (;;) {
    const valor = leer();
    if (valor) return valor;
    if (Date.now() > fin) return null;
    await espera(150);
  }
}

// Read once and forget: a code that fails stays on screen with Webflow's own error, and is
// not retried on the next visit.
async function principal() {
  const codigo = leerCupon(document.cookie);
  if (!codigo) return;
  document.cookie = cookieCupon('', dominioCompartido(location.hostname, SITIO), true);
  const campo = await hasta(() =>
    document.querySelector                  ('.w-commerce-commercecheckoutdiscountsinput')
  );
  const boton = document.querySelector             ('.w-commerce-commercecheckoutdiscountsbutton');
  if (!campo || !boton) return;
  // Webflow fills the summary once the cart has loaded; applying before that is lost.
  await hasta(() =>
    document.querySelector('.w-commerce-commercecheckoutsummarytotal')?.textContent?.trim()
  );
  await espera(400);
  campo.value = codigo;
  campo.dispatchEvent(new Event('input', { bubbles: true }));
  campo.dispatchEvent(new Event('change', { bubbles: true }));
  boton.click();
}

principal();
})();
</script>
