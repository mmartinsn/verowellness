const VOLVER = "https://veronicawellness.com/";
const normalizarNombre = (nombre        ) =>
  nombre.normalize('NFC').replace(/\s+/g, ' ').trim().toLowerCase();

function destinoGracias(
  nombres          ,
  descargas            ,
  catalogo                 
)                {
  const productos = nombres
    .map((n) => catalogo.porNombre[normalizarNombre(n)])
    .filter((p)                       => !!p);
  return destinoDeProductos(productos, descargas);
}

function destinoDeProductos(
  productos                   ,
  descargas            
)                {
  const asesoria = productos.find((p) => p.tipo === 'asesoria');
  const guias = [...new Set(productos.flatMap((p) => (p.guia ? [p.guia] : [])))];
  const q = new URLSearchParams();
  let ruta        ;
  if (productos.some((p) => p.tipo === 'examen')) {
    ruta = 'gracias/examenes/';
    if (asesoria) q.set('lectura', '1');
  } else if (asesoria) ruta = `gracias/${asesoria.id}/`;
  else if (guias.length) {
    ruta = 'gracias/tienda/';
    q.set('guias', guias.join(','));
  } else return null;
  const seguras = descargas.filter((d) => d.nombre && /^https:\/\//.test(d.url));
  if (seguras.length) q.set('descargas', JSON.stringify(seguras));
  const query = q.toString();
  return query ? `${ruta}?${query}` : ruta;
}
const ITEM = '.w-commerce-commercecheckoutorderitem';
const NOMBRE = '.w-commerce-commerceboldtextblock';
const DESCARGA = '[data-node-type="commerce-downloads-button"]';
const PLAZO_MS = 10000;
const PASO_MS = 150;

const texto = (nodo                            ) => nodo?.textContent?.trim() ?? '';

function leerNombres()           {
  return [...document.querySelectorAll(`${ITEM} ${NOMBRE}`)].map(texto).filter(Boolean);
}

function leerDescargas()             {
  return [...document.querySelectorAll                   (DESCARGA)].map((a) => ({
    nombre: texto(a.closest(ITEM)?.querySelector(NOMBRE)) || texto(a),
    url: a.href,
  }));
}

async function llevarAGracias() {
  const limite = Date.now() + PLAZO_MS;
  while (Date.now() < limite) {
    const nombres = leerNombres();
    if (nombres.length) {
      const destino = destinoGracias(nombres, leerDescargas(), CATALOGO);
      if (destino) location.replace(VOLVER + destino);
      return;
    }
    await new Promise((r) => setTimeout(r, PASO_MS));
  }
}

llevarAGracias();
